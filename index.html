<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCUK 广州国际学习中心 — 学生学情分析报告</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f5f6fa;
    color: #2d3436;
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #c0392b 0%, #e74c3c 100%);
    color: #fff;
    padding: 48px 24px 40px;
    text-align: center;
  }
  .header h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
  .header p { font-size: 15px; opacity: 0.9; }
  .container {
    max-width: 600px;
    margin: -24px auto 48px;
    padding: 0 20px;
  }

  .login-box {
    background: #fff;
    border-radius: 12px;
    padding: 36px 28px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    text-align: center;
  }
  .login-box h2 { font-size: 20px; margin-bottom: 8px; color: #2d3436; }
  .login-box p { font-size: 14px; color: #888; margin-bottom: 24px; }
  .login-select {
    width: 100%;
    padding: 14px 16px;
    font-size: 16px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    background: #fff;
    color: #2d3436;
    cursor: pointer;
    outline: none;
  }
  .login-select:focus { border-color: #c0392b; }
  .login-btn {
    width: 100%;
    padding: 14px;
    margin-top: 14px;
    font-size: 16px;
    font-weight: 600;
    background: #c0392b;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .login-btn:hover { background: #a93226; }

  .report-box {
    background: #fff;
    border-radius: 12px;
    padding: 32px 28px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .report-header {
    text-align: center;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 2px solid #f0f0f0;
  }
  .report-header .student-name { font-size: 24px; font-weight: 700; color: #c0392b; }
  .report-header .class-tag {
    display: inline-block;
    margin-top: 8px;
    padding: 4px 12px;
    font-size: 13px;
    background: #fdf2f0;
    color: #c0392b;
    border-radius: 20px;
  }
  .report-list { display: flex; flex-direction: column; gap: 12px; }
  .report-item {
    display: flex;
    align-items: center;
    padding: 16px 18px;
    background: #f8f9fa;
    border-radius: 8px;
    text-decoration: none;
    color: #2d3436;
    transition: all 0.2s;
    border: 1px solid #eee;
  }
  .report-item:hover {
    background: #fff;
    border-color: #c0392b;
    box-shadow: 0 4px 12px rgba(192,57,43,0.12);
    transform: translateY(-2px);
  }
  .report-icon { font-size: 24px; margin-right: 14px; }
  .report-info { flex: 1; }
  .report-title { font-size: 16px; font-weight: 600; }
  .report-desc { font-size: 13px; color: #999; margin-top: 2px; }
  .report-arrow { color: #ccc; font-size: 20px; }
  .no-report { text-align: center; padding: 40px 20px; color: #999; }
  .no-report .emoji { font-size: 48px; margin-bottom: 12px; }
  .logout-btn {
    display: block;
    width: 100%;
    padding: 12px;
    margin-top: 20px;
    font-size: 14px;
    background: #f0f0f0;
    color: #666;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .logout-btn:hover { background: #e0e0e0; }
  .footer { text-align: center; padding: 24px; color: #aaa; font-size: 13px; }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="header">
  <h1>NCUK 广州国际学习中心</h1>
  <p>学生学情分析报告系统</p>
</div>

<div class="container">

  <div class="login-box" id="loginScreen">
    <h2>请选择你的姓名</h2>
    <p>选择后只能查看你自己的学情报告</p>
    <select class="login-select" id="studentSelect">
      <option value="">— 请选择姓名 —</option>
      <optgroup label="文商班">
        <option value="陈文慧">陈文慧</option>
        <option value="陈梁烽">陈梁烽</option>
        <option value="陈玫仰">陈玫仰</option>

        <option value="段泽原">段泽原</option>
        <option value="黄商怡">黄商怡</option>
        <option value="李坤宸">李坤宸</option>
        <option value="李志强">李志强</option>
        <option value="刘锐恒">刘锐恒</option>
        <option value="石奈儿">石奈儿</option>
        <option value="王加珲">王加珲</option>
        <option value="徐徐锣涛">徐徐锣涛</option>
        <option value="徐彦霖">徐彦霖</option>
        <option value="张梓妍">张梓妍</option>
        <option value="周清华">周清华</option>
        <option value="周盈">周盈</option>
      </optgroup>
      <optgroup label="理工班">
        <option value="廖裕源">廖裕源</option>
        <option value="刘鹏翔">刘鹏翔</option>
        <option value="曲宸毅">曲宸毅</option>
        <option value="吴昊峻">吴昊峻</option>
        <option value="夏一凡">夏一凡</option>
        <option value="叶子峻">叶子峻</option>
        <option value="朱恒羽">朱恒羽</option>
      </optgroup>
    </select>
    <button class="login-btn" onclick="showReport()">查看我的报告</button>
  </div>

  <div class="report-box hidden" id="reportScreen">
    <div class="report-header">
      <div class="student-name" id="reportName"></div>
      <div class="class-tag" id="reportClass"></div>
    </div>
    <div class="report-list" id="reportList"></div>
    <button class="logout-btn" onclick="logout()">退出，返回姓名选择</button>
  </div>

</div>

<div class="footer">NCUK Guangzhou International Study Centre</div>

  "叶子峻": { class: "理工班", reports: [] },
  "朱恒羽": { class: "理工班", reports: [] }
};

function showReport() {
  const name = document.getElementById('studentSelect').value;
  if (!name) { alert('请先选择你的姓名'); return; }
  const data = studentData[name];
  document.getElementById('reportName').textContent = name;
  document.getElementById('reportClass').textContent = data.class;
  const list = document.getElementById('reportList');
  list.innerHTML = '';
  if (data.reports.length === 0) {
    list.innerHTML = '<div class="no-report"><div class="emoji">📝</div><p>暂无已发布的报告<br>请等待老师更新</p></div>';
  } else {
    data.reports.forEach(r => {
      list.innerHTML += '<a class="report-item" href="' + r.url + '" target="_blank">' +
        '<div class="report-icon">' + r.icon + '</div>' +
        '<div class="report-info"><div class="report-title">' + r.title + '</div>' +
        '<div class="report-desc">' + r.desc + '</div></div>' +
        '<div class="report-arrow">›</div></a>';
    });
  }
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('reportScreen').classList.remove('hidden');
}

function logout() {
  document.getElementById('studentSelect').value = '';
  document.getElementById('reportScreen').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
}
</script>

</body>
</html>
