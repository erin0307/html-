<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCUK 广州国际学习中心 — 学情报告</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f5f6fa;
    color: #2d3436;
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #c0392b 0%, #e74c3c 100%);
    color: #fff;
    padding: 40px 24px 36px;
    text-align: center;
  }
  .header h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  .header p { font-size: 14px; opacity: 0.9; }
  .container {
    max-width: 560px;
    margin: -20px auto 48px;
    padding: 0 16px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 32px 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .student-header {
    text-align: center;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 2px solid #f0f0f0;
  }
  .student-header .name { font-size: 26px; font-weight: 700; color: #c0392b; }
  .student-header .tag {
    display: inline-block;
    margin-top: 8px;
    padding: 4px 14px;
    font-size: 13px;
    background: #fdf2f0;
    color: #c0392b;
    border-radius: 20px;
  }
  .report-list { display: flex; flex-direction: column; gap: 12px; }
  .report-link {
    display: flex;
    align-items: center;
    padding: 16px 18px;
    background: #f8f9fa;
    border-radius: 8px;
    text-decoration: none;
    color: #2d3436;
    border: 1px solid #eee;
    transition: all 0.2s;
  }
  .report-link:hover {
    background: #fff;
    border-color: #c0392b;
    box-shadow: 0 4px 12px rgba(192,57,43,0.12);
    transform: translateY(-2px);
  }
  .report-icon { font-size: 28px; margin-right: 14px; }
  .report-text { flex: 1; }
  .report-title { font-size: 16px; font-weight: 600; }
  .report-desc { font-size: 13px; color: #999; margin-top: 2px; }
  .report-go { color: #ccc; font-size: 22px; }
  .empty { text-align: center; padding: 40px 20px; color: #999; }
  .empty .emoji { font-size: 48px; margin-bottom: 12px; }

  /* Name selection page */
  .select-box { text-align: center; }
  .select-box h2 { font-size: 20px; margin-bottom: 6px; }
  .select-box p { font-size: 14px; color: #888; margin-bottom: 20px; }
  .class-group { margin-bottom: 16px; }
  .class-label {
    font-size: 14px;
    font-weight: 600;
    color: #c0392b;
    text-align: left;
    margin-bottom: 10px;
    padding-left: 4px;
  }
  .name-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .name-btn {
    padding: 10px 6px;
    font-size: 14px;
    background: #f8f9fa;
    border: 1px solid #eee;
    border-radius: 6px;
    cursor: pointer;
    color: #2d3436;
    text-decoration: none;
    text-align: center;
    transition: all 0.15s;
  }
  .name-btn:hover {
    background: #c0392b;
    color: #fff;
    border-color: #c0392b;
  }
  .name-btn.has-report {
    background: #fdf2f0;
    border-color: #f5c6cb;
    color: #c0392b;
    font-weight: 500;
  }
  .name-btn.has-report:hover {
    background: #c0392b;
    color: #fff;
  }
  .footer { text-align: center; padding: 24px; color: #aaa; font-size: 13px; }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="header">
  <h1>NCUK 广州国际学习中心</h1>
  <p>学生学情分析报告</p>
</div>

<div class="container">

  <!-- Student report page (shown when URL has #studentName) -->
  <div class="card hidden" id="reportPage">
    <div class="student-header">
      <div class="name" id="studentName"></div>
      <div class="tag" id="studentClass"></div>
    </div>
    <div class="report-list" id="reportList"></div>
  </div>

  <!-- Name selection page (default) -->
  <div class="card select-box" id="selectPage">
    <h2>请选择你的姓名</h2>
    <p>点击后查看你的学情报告</p>
    <div class="class-group">
      <div class="class-label">📘 文商班</div>
      <div class="name-grid" id="wsNames"></div>
    </div>
    <div class="class-group">
      <div class="class-label">📗 理工班</div>
      <div class="name-grid" id="lgNames"></div>
    </div>
  </div>

</div>

<div class="footer">NCUK Guangzhou International Study Centre</div>

function renderSelectPage() {
  const ws = document.getElementById('wsNames');
  const lg = document.getElementById('lgNames');
  ws.innerHTML = '';
  lg.innerHTML = '';
  for (const [key, s] of Object.entries(students)) {
    const btn = document.createElement('a');
    btn.className = 'name-btn' + (s.reports.length > 0 ? ' has-report' : '');
    btn.textContent = s.name;
    btn.href = '#' + key;
    if (s.class === '文商班') ws.appendChild(btn);
    else lg.appendChild(btn);
  }
}

function renderReport(key) {
  const s = students[key];
  if (!s) return;
  document.getElementById('studentName').textContent = s.name;
  document.getElementById('studentClass').textContent = s.class;
  const list = document.getElementById('reportList');
  list.innerHTML = '';
  if (s.reports.length === 0) {
    list.innerHTML = '<div class="empty"><div class="emoji">📝</div><p>暂无已发布的报告<br>请等待老师更新</p></div>';
  } else {
    s.reports.forEach(r => {
      const a = document.createElement('a');
      a.className = 'report-link';
      a.href = r.url;
      a.target = '_blank';
      a.innerHTML = '<div class="report-icon">' + r.icon + '</div>' +
        '<div class="report-text"><div class="report-title">' + r.title + '</div>' +
        '<div class="report-desc">' + r.desc + '</div></div>' +
        '<div class="report-go">›</div>';
      list.appendChild(a);
    });
  }
  document.getElementById('selectPage').classList.add('hidden');
  document.getElementById('reportPage').classList.remove('hidden');
}

function route() {
  const hash = location.hash.slice(1);
  if (hash && students[hash]) {
    renderReport(hash);
  } else {
    renderSelectPage();
    document.getElementById('reportPage').classList.add('hidden');
    document.getElementById('selectPage').classList.remove('hidden');
  }
}

window.addEventListener('hashchange', route);
route();
</script>

</html>
