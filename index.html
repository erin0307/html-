    background: #f5f6fa;
    color: #2d3436;
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #c0392b 0%, #e74c3c 100%);
    color: #fff;
    padding: 40px 24px 36px;
    text-align: center;
  }
  .header h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  .header p { font-size: 14px; opacity: 0.9; }
  .container {
    max-width: 560px;
    margin: -20px auto 48px;
    padding: 0 16px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 32px 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .student-header {
    text-align: center;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 2px solid #f0f0f0;
  }
  .student-header .name { font-size: 26px; font-weight: 700; color: #c0392b; }
  .student-header .tag {
    display: inline-block;
    margin-top: 8px;
    padding: 4px 14px;
    font-size: 13px;
    background: #fdf2f0;
    color: #c0392b;
    border-radius: 20px;
  }
  .report-list { display: flex; flex-direction: column; gap: 12px; }
  .report-link {
    display: flex;
    align-items: center;
    padding: 16px 18px;
    background: #f8f9fa;
    border-radius: 8px;
    text-decoration: none;
    color: #2d3436;
    border: 1px solid #eee;
    transition: all 0.2s;
  }
  .report-link:hover {
    background: #fff;
    border-color: #c0392b;
    box-shadow: 0 4px 12px rgba(192,57,43,0.12);
    transform: translateY(-2px);
  }
  .report-icon { font-size: 28px; margin-right: 14px; }
  .report-text { flex: 1; }
  .report-title { font-size: 16px; font-weight: 600; }
  .report-desc { font-size: 13px; color: #999; margin-top: 2px; }
  .report-go { color: #ccc; font-size: 22px; }
  .empty { text-align: center; padding: 40px 20px; color: #999; }
  .empty .emoji { font-size: 48px; margin-bottom: 12px; }
  .no-access {
    text-align: center;
    padding: 60px 24px;
  }
  .no-access .emoji { font-size: 56px; margin-bottom: 16px; }
  .no-access h2 { font-size: 18px; margin-bottom: 8px; color: #333; }
  .no-access p { font-size: 14px; color: #999; }
  .footer { text-align: center; padding: 24px; color: #aaa; font-size: 13px; }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="header">
  <h1>NCUK 广州国际学习中心</h1>
  <p>学生学情分析报告</p>
</div>

    </div>
    <div class="report-list" id="reportList"></div>

  <!-- 无权限提示页（直接访问主页时显示） -->

    <p>如需查看学情报告，请联系班主任获取个人专属链接</p>

function renderReport(key) {
  const s = students[key];
  if (!s) {
    document.getElementById('reportPage').classList.add('hidden');
    document.getElementById('noAccessPage').classList.remove('hidden');
    return;
  }
  document.getElementById('studentName').textContent = s.name;
  document.getElementById('studentClass').textContent = s.class;
  const list = document.getElementById('reportList');
  list.innerHTML = '';
  if (s.reports.length === 0) {
    list.innerHTML = '<div class="empty"><div class="emoji">📝</div><p>暂无已发布的报告<br>请等待老师更新</p></div>';
  } else {
    s.reports.forEach(r => {
      const a = document.createElement('a');
      a.className = 'report-link';
      a.href = r.url;
      a.target = '_blank';
      a.innerHTML = '<div class="report-icon">' + r.icon + '</div>' +
        '<div class="report-text"><div class="report-title">' + r.title + '</div>' +
        '<div class="report-desc">' + r.desc + '</div></div>' +
        '<div class="report-go">›</div>';
      list.appendChild(a);
    });
  }
  document.getElementById('noAccessPage').classList.add('hidden');
  document.getElementById('reportPage').classList.remove('hidden');
}

function route() {
  const hash = location.hash.slice(1);
  if (hash && students[hash]) {
    renderReport(hash);
  } else {
    document.getElementById('reportPage').classList.add('hidden');
    document.getElementById('noAccessPage').classList.remove('hidden');
  }
}

window.addEventListener('hashchange', route);
route();
