<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f5f6fa;
    color: #2d3436;
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #c0392b 0%, #e74c3c 100%);
    color: #fff;
    padding: 48px 24px 40px;
    text-align: center;
  }
  .header h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
  .header p { font-size: 15px; opacity: 0.9; }
  .container {
    max-width: 960px;
    margin: -24px auto 48px;
    padding: 0 20px;
  }
  .class-section {
    background: #fff;
    border-radius: 12px;
    padding: 28px;
    margin-bottom: 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .class-title {
    font-size: 18px;
    font-weight: 600;
    color: #c0392b;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 2px solid #f0f0f0;
  }
  .student-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
  }
  .student-card {
    display: block;
    padding: 16px 18px;
    background: #f8f9fa;
    border-radius: 8px;
    text-decoration: none;
    color: #2d3436;
    font-size: 15px;
    font-weight: 500;
    transition: all 0.2s;
    border: 1px solid #eee;
  }
  .student-card:hover {
    background: #fff;
    border-color: #c0392b;
    box-shadow: 0 4px 12px rgba(192,57,43,0.12);
    transform: translateY(-2px);
  }
  .student-card.available {
    background: #fdf2f0;
    border-color: #f5c6cb;
  }
  .student-card.available:hover {
    background: #fff;
  }
  .student-name { font-size: 16px; font-weight: 600; }
  .student-status {
    font-size: 12px;
    color: #999;
    margin-top: 4px;
  }
  .student-card.available .student-status {
    color: #c0392b;
  }
  .footer {
    text-align: center;
    padding: 24px;
    color: #aaa;
    font-size: 13px;
  }
</style>
